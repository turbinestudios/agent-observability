appId: com.turbinestudios.agent-observability
productName: Agent Observability
copyright: Copyright © Turbine Studios

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# better-sqlite3 ships Node-API prebuilds (prebuilds/<platform>-<arch>.node),
# and Node-API is ABI-stable across both Node and Electron releases — the
# shipped binary loads under Electron unchanged. Rebuilding would force a
# source compile, which needs Visual Studio or Xcode on every runner and buys
# nothing. Verified by loading the module under Electron before turning this off.
npmRebuild: false

# A publish provider is configured so electron-builder generates the update
# metadata electron-updater needs (latest*.yml, *.blockmap) and embeds a correct
# app-update.yml in the package — but nothing is ever uploaded from here: every
# invocation runs with --publish never, and the release workflow attaches the
# artifacts to a GitHub Release itself. owner/repo are explicit because no
# package.json declares a repository field. `private: true` records that the
# feed needs auth; the read-only PAT is baked into the main bundle at build
# time (see src/main/updater.ts), never written into this file.
publish:
  provider: github
  owner: turbinestudios
  repo: agent-observability
  private: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Builds are unsigned. `identity: null` still applies an ad-hoc signature,
  # which is what lets the app launch at all on Apple Silicon; Gatekeeper will
  # warn on first open (see README).
  identity: null
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Arch is in every filename: installing a mac x64 build on Apple Silicon (or the
# reverse) fails in confusing ways, and users pick from a flat list of assets.
# No spaces in the name: GitHub rewrites spaces in uploaded asset names to '.',
# while electron-updater looks assets up with spaces rewritten to '-' — a space
# here guarantees ERR_UPDATER_ASSET_NOT_FOUND at download time.
artifactName: Agent-Observability-${version}-${os}-${arch}.${ext}
