receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth

processors:
  batch:
    timeout: 5s
    send_batch_size: 256
  resource:
    attributes:
      - key: service.namespace
        value: agent-observability
        action: upsert
      - key: deployment.environment
        value: production
        action: insert
      - key: service.name
        value: unknown-repo
        action: insert

exporters:
  azuremonitor:
    connection_string: ${env:AZURE_MONITOR_CONNECTION_STRING}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  basicauth:
    htpasswd:
      inline: ${env:OTEL_BASICAUTH_HTPASSWD}

service:
  extensions: [health_check, zpages, basicauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [azuremonitor]
