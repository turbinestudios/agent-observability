name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'src/dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrao
  AZURE_RESOURCE_GROUP: rg-agent-observability
  CONTAINER_APP_NAME: ca-ao-dashboard

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/dashboard:${{ github.sha }}
          docker build -t $IMAGE src/dashboard/AgentObservability.Dashboard
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/dashboard:latest src/dashboard/AgentObservability.Dashboard
          docker push $IMAGE
          docker push ${{ env.ACR_NAME }}.azurecr.io/dashboard:latest

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/dashboard:${{ github.sha }}
