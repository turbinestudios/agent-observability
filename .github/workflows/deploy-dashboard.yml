name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'src/dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Deployment targets are repository variables, so no Azure resource names live
# in the code. Forks have no Azure credentials, so the jobs only run in the
# upstream repository, and every deploy waits for approval in the
# `production` environment.
env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  build:
    name: Build & Push Image
    if: github.repository == 'turbinestudios/agent-observability'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/dashboard:${{ github.sha }}
          docker build -t $IMAGE src/dashboard/AgentObservability.Dashboard
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/dashboard:latest src/dashboard/AgentObservability.Dashboard
          docker push $IMAGE
          docker push ${{ env.ACR_NAME }}.azurecr.io/dashboard:latest

  deploy:
    name: Deploy to Container Apps
    if: github.repository == 'turbinestudios/agent-observability'
    environment: production
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/dashboard:${{ github.sha }}
