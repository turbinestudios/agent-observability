name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/collector/otel-collector-config.yaml'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-agent-observability
  AZURE_LOCATION: swedencentral

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            location=${{ env.AZURE_LOCATION }}
            baseName=agent-obs
            otelCollectorImage=otel/opentelemetry-collector-contrib:0.102.0
            dashboardImage=${{ vars.DASHBOARD_IMAGE || 'mcr.microsoft.com/dotnet/samples:aspnetapp' }}
            otelCollectorConfig="${{ '' }}"
          additionalArguments: --what-if
          deploymentMode: Incremental

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }}

      - name: Generate parameters file
        run: |
          CONFIG=$(cat src/collector/otel-collector-config.yaml)
          jq -n \
            --arg location "${{ env.AZURE_LOCATION }}" \
            --arg baseName "agent-obs" \
            --arg otelCollectorImage "otel/opentelemetry-collector-contrib:0.102.0" \
            --arg dashboardImage "${{ vars.DASHBOARD_IMAGE || 'mcr.microsoft.com/dotnet/samples:aspnetapp' }}" \
            --arg otelCollectorConfig "$CONFIG" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "location": {"value": $location},
                "baseName": {"value": $baseName},
                "otelCollectorImage": {"value": $otelCollectorImage},
                "dashboardImage": {"value": $dashboardImage},
                "otelCollectorConfig": {"value": $otelCollectorConfig}
              }
            }' > infra/deploy-parameters.json

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/deploy-parameters.json
          deploymentMode: Incremental
