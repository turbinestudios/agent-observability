name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/collector/otel-collector-config.yaml'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-agent-observability
  AZURE_LOCATION: swedencentral

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            location=${{ env.AZURE_LOCATION }}
            baseName=agent-obs
            otelCollectorImage=otel/opentelemetry-collector-contrib:0.102.0
            dashboardImage=${{ vars.DASHBOARD_IMAGE || 'mcr.microsoft.com/dotnet/samples:aspnetapp' }}
            azureMonitorConnectionString=${{ secrets.AZURE_MONITOR_CONNECTION_STRING }}
            otelCollectorConfig="${{ '' }}"
          additionalArguments: --what-if
          deploymentMode: Incremental

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }}

      - name: Load OTel Collector config
        id: otel-config
        run: |
          CONFIG=$(cat src/collector/otel-collector-config.yaml)
          echo "config<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONFIG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            location=${{ env.AZURE_LOCATION }}
            baseName=agent-obs
            otelCollectorImage=otel/opentelemetry-collector-contrib:0.102.0
            dashboardImage=${{ vars.DASHBOARD_IMAGE || 'mcr.microsoft.com/dotnet/samples:aspnetapp' }}
            azureMonitorConnectionString=${{ secrets.AZURE_MONITOR_CONNECTION_STRING }}
            otelCollectorConfig=${{ steps.otel-config.outputs.config }}
          deploymentMode: Incremental
