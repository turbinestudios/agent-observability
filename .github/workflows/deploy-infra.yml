name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Deployment targets are repository variables, so no Azure resource names live
# in the code. Forks have no Azure credentials, so the jobs only run in the
# upstream repository, and every deploy waits for approval in the
# `production` environment.
env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  DASHBOARD_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/dashboard:latest

jobs:
  validate:
    name: Validate Bicep
    if: github.repository == 'turbinestudios/agent-observability'
    environment: production
    env:
      INGESTION_KEY_PEPPER: ${{ secrets.INGESTION_KEY_PEPPER }}
      DASHBOARD_AUTH_CLIENT_ID: ${{ vars.DASHBOARD_AUTH_CLIENT_ID }}
      DASHBOARD_AUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_AUTH_CLIENT_SECRET }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/parameters.bicepparam
          additionalArguments: --what-if
          deploymentMode: Incremental

  deploy:
    name: Deploy Infrastructure
    if: github.repository == 'turbinestudios/agent-observability'
    environment: production
    env:
      INGESTION_KEY_PEPPER: ${{ secrets.INGESTION_KEY_PEPPER }}
      DASHBOARD_AUTH_CLIENT_ID: ${{ vars.DASHBOARD_AUTH_CLIENT_ID }}
      DASHBOARD_AUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_AUTH_CLIENT_SECRET }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/parameters.bicepparam
          deploymentMode: Incremental
