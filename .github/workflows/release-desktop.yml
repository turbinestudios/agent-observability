name: Release Desktop App

# Tagged releases only. The extension versions independently, so desktop tags
# are namespaced: desktop-v0.1.0, desktop-v0.2.0, …
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the installers but do not create a release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not discard the other's artifacts — a
      # partial release is more useful than none, and easier to diagnose.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs every workspace, including the shared core the app bundles.
      - name: Install
        run: npm ci

      # The tag is the single source of truth for the released version: the
      # checked-in package.json version only shows in local dev builds. This is
      # what keeps app.getVersion(), latest.yml, and the tag in agreement —
      # auto-update compares the first two, humans read the third. Runs after
      # `npm ci` so lockfile validation is undisturbed.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#desktop-v}" -w agent-observability-desktop

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build renderer, preload, and data host
        env:
          # Turns on update checks in the app. The repo is public, so the
          # update feed needs no token. Belongs on THIS step, not the
          # electron-builder one: the flag is baked in when electron-vite
          # writes the bundle. Only this repo's releases set it, so a fork's
          # builds never offer upstream's installers.
          MAIN_VITE_ENABLE_UPDATES: ${{ github.repository == 'turbinestudios/agent-observability' && '1' || '' }}
        run: npm run build -w agent-observability-desktop

      # Split per platform so the macOS certificate never reaches the Windows
      # leg — electron-builder would try to sign the NSIS installer with it.
      - name: Package installers (Windows)
        if: matrix.artifact == 'windows'
        working-directory: src/desktop/agent-observability-desktop
        # Windows builds are unsigned: no certificate is configured, and
        # auto-discovery would otherwise pick up an unrelated keychain identity
        # on a self-hosted runner and fail the build.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.yml --publish never

      - name: Package installers (macOS)
        if: matrix.artifact == 'macos'
        working-directory: src/desktop/agent-observability-desktop
        shell: bash
        # Signed and notarized when the secrets exist (see
        # docs/macos-signing-and-notarization.md); without them (forks, dry
        # runs) this falls back to the unsigned build exactly as before.
        #
        # The certificate is deliberately NOT handed to electron-builder as
        # CSC_LINK. Its own keychain import passes the .p12 export password to
        # `security set-key-partition-list -k`, which wants the KEYCHAIN
        # password — macOS tolerated the mismatch until the runner image moved
        # to Darwin 25.6 and started failing the build with "the user name or
        # passphrase you entered is not correct". Building the keychain here
        # and pointing electron-builder at it with CSC_KEYCHAIN sidesteps that
        # code path entirely; identity discovery still finds the cert.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --config electron-builder.yml --publish never \
              -c.mac.notarize=false
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$MAC_CERT_P12" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          # No arguments: no lock timeout, so the keychain stays open across
          # notarization, which takes minutes.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain"

          # Notarization wants the .p8 as a file; the secret holds its text.
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
          export CSC_KEYCHAIN="$keychain"
          npx electron-builder --config electron-builder.yml --publish never

      - name: Verify signature and notarization (macOS)
        if: matrix.artifact == 'macos'
        working-directory: src/desktop/agent-observability-desktop
        # Proof on the runner itself, so a release cut from a Windows machine
        # never needs a Mac to confirm: a valid deep signature and a stapled
        # notarization ticket on both architectures, or the build fails here
        # instead of in front of a user. Skipped for unsigned fallback builds.
        env:
          HAS_CERTS: ${{ secrets.MAC_CERT_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          if [ "$HAS_CERTS" != "true" ]; then
            echo "No signing secrets — unsigned build, nothing to verify."
            exit 0
          fi
          for app in release/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          # latest*.yml and *.blockmap are the electron-updater feed: without
          # them attached to the release, installed apps never see an update.
          # The globs deliberately miss builder-debug.yml and
          # builder-effective-config.yaml, which also land in release/.
          path: |
            src/desktop/agent-observability-desktop/release/*.dmg
            src/desktop/agent-observability-desktop/release/*.zip
            src/desktop/agent-observability-desktop/release/*.exe
            src/desktop/agent-observability-desktop/release/latest*.yml
            src/desktop/agent-observability-desktop/release/*.blockmap

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: List what will be attached
        run: ls -lh installers

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # Drafted rather than published: someone should download and open one
          # build per platform before users see it — CI verifies signatures but
          # never actually launches the app.
          draft: true
          name: Agent Observability Desktop ${{ github.ref_name }}
          body: |
            Desktop app build for `${{ github.ref_name }}`.

            Download the installer for your platform. macOS users: pick
            **arm64** for Apple Silicon and **x64** for Intel — the wrong
            architecture will not launch.

            ### First launch

            - **macOS** — builds are signed and notarized: drag to
              Applications and double-click. (Only releases from BEFORE
              signing was set up say "damaged" — for those, run
              `xattr -cr "/Applications/Agent Observability.app"`.)
            - **Windows** — builds are not signed, so SmartScreen warns:
              choose **More info** → **Run anyway**.

            ### Auto-update

            Installed apps check this repo's releases at startup — but only
            **published** ones, so nothing reaches users until this draft is
            published. Windows updates itself after a prompt; macOS shows a
            dialog linking back to this page.
